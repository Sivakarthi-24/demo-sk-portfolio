<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0f19" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <!-- Circuit node marks -->
  <circle cx="14" cy="14" r="2.5" fill="#38bdf8" />
  <line x1="14" y1="14" x2="22" y2="14" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="50" cy="50" r="2.5" fill="#60a5fa" />
  <line x1="50" y1="50" x2="42" y2="50" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
  <!-- Monogram S / Code bracket -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">SK</text>
</svg>
